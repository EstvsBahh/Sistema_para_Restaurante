{% extends "base.html" %}
{% block conteudo %}
<h1>Garçons</h1>

<div class="card">
    <form method="POST" action="{{ url_for('garcom.cadastrar_garcom') }}">
        <input type="text" name="nome" placeholder="Nome do garçom" required>
        <button type="submit">Cadastrar garçom</button>
    </form>
</div>

<table>
    <tr><th>ID</th><th>Nome</th></tr>
    {% for garcom in garcons %}
    <tr><td>{{ garcom.id }}</td><td>{{ garcom.nome }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
