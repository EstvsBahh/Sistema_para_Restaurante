<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel{% endblock %} · {{ nome_restaurante }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
{% set ep = request.endpoint or '' %}
{% set bp = request.blueprint or '' %}

<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
  <div class="container-fluid px-3 px-lg-4" style="max-width: 1400px;">
    <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
       <span class="brand-icon"><i class="fa-solid fa-utensils"></i></span>{{ nome_restaurante }}
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

     <div class="collapse navbar-collapse" id="menuPrincipal">
       <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
          <li class="nav-item">
             <a class="nav-link {{ 'active' if ep == 'home' }}" href="{{ url_for('home') }}"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
             <a class="nav-link {{ 'active' if bp == 'mesas' }}" href="{{ url_for('mesas.listar') }}"><i class="fa-solid fa-table-cells-large me-1"></i> Mesas</a>
          </li>
          <li class="nav-item">
             <a class="nav-link {{ 'active' if ep == 'pedidos.novo' }}" href="{{ url_for('pedidos.novo') }}"><i class="fa-solid fa-plus me-1"></i> Novo pedido</a>
          </li>
          <li class="nav-item">
             <a class="nav-link {{ 'active' if ep == 'pedidos.cozinha' }}" href="{{ url_for('pedidos.cozinha') }}"><i class="fa-solid fa-fire-burner me-1"></i> Cozinha</a>
          </li>
          <li class="nav-item">
             <a class="nav-link {{ 'active' if bp == 'pagamentos' }}" href="{{ url_for('pagamentos.caixa') }}"><i class="fa-solid fa-cash-register me-1"></i> Caixa</a>
          </li>
          <li class="nav-item dropdown">
             <a class="nav-link dropdown-toggle {{ 'active' if bp in ('produtos', 'categorias') }}" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-book-open me-1"></i> Cardápio
             </a>
             <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{{ url_for('produtos.listar') }}"><i class="fa-solid fa-burger fa-fw me-2 text-secondary"></i>Produtos</a></li>
                <li><a class="dropdown-item" href="{{ url_for('categorias.listar') }}"><i class="fa-solid fa-tags fa-fw me-2 text-secondary"></i>Categorias</a></li>
                <li><a class="dropdown-item" href="{{ url_for('produtos.estoque') }}"><i class="fa-solid fa-boxes-stacked fa-fw me-2 text-secondary"></i>Estoque</a></li>
             </ul>
