{% extends "base.html" %}
{% block conteudo %}
<h1>Abrir novo pedido</h1>

<div class="card">
    <form method="POST" action="{{ url_for('pedido.abrir_pedido') }}">
        <select name="mesa_numero" required>
            <option value="" disabled selected>Mesa (livre)</option>
            {% for mesa in mesas %}
            <option value="{{ mesa.numero }}">Mesa {{ mesa.numero }}</option>
            {% endfor %}
        </select>
        <select name="garcom_id" required>
            <option value="" disabled selected>Garçom</option>
            {% for garcom in garcons %}
            <option value="{{ garcom.id }}">{{ garcom.nome }}</option>
            {% endfor %}
        </select>
        <button type="submit">Abrir pedido</button>
    </form>
</div>
{% endblock %}
